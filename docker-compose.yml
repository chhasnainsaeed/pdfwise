# Production on a VPS: PDFwise + Caddy (automatic HTTPS from Let's Encrypt).
#
#   cp .env.example .env      # set DOMAIN and anything else you need
#   docker compose up -d --build
#
# Update after a git pull:   docker compose up -d --build
# Logs:                      docker compose logs -f pdfwise
# See README → Deploy → VPS for the full walkthrough (DNS, firewall, Cloudflare).

services:
  pdfwise:
    build:
      context: .
      args:
        INCLUDE_LIBREOFFICE: ${INCLUDE_LIBREOFFICE:-false}
        SITE_URL: https://${DOMAIN:?Set DOMAIN in .env}
        GOOGLE_SITE_VERIFICATION: ${GOOGLE_SITE_VERIFICATION:-}
        BING_SITE_VERIFICATION: ${BING_SITE_VERIFICATION:-}
        VITE_PLAUSIBLE_DOMAIN: ${VITE_PLAUSIBLE_DOMAIN:-}
        VITE_PLAUSIBLE_SRC: ${VITE_PLAUSIBLE_SRC:-}
        VITE_UMAMI_WEBSITE_ID: ${VITE_UMAMI_WEBSITE_ID:-}
        VITE_UMAMI_SRC: ${VITE_UMAMI_SRC:-}
    image: pdfwise:latest
    restart: unless-stopped
    environment:
      # 1 = behind Caddy only. 2 = Cloudflare → Caddy (also set TRUSTED_PROXIES). Rate limits use the
      # visitor's real IP only when this matches your setup.
      TRUST_PROXY: ${TRUST_PROXY:-1}
      RATE_LIMIT_PER_MIN: ${RATE_LIMIT_PER_MIN:-30}
      MAX_UPLOAD_MB: ${MAX_UPLOAD_MB:-100}
      CONVERT_CONCURRENCY: ${CONVERT_CONCURRENCY:-2}
      BROWSER_CONCURRENCY: ${BROWSER_CONCURRENCY:-3}
      # Leave empty for a public site. Set user:password to put the whole site behind a login.
      BASIC_AUTH: ${BASIC_AUTH:-}
    # Only Caddy can reach the app; nothing is published on the host.
    expose:
      - '3001'
    # Reaps leftover Chromium/LibreOffice processes (Node as PID 1 doesn't).
    init: true
    # Chromium uses /dev/shm for rendering; Docker's 64 MB default crashes it on big pages.
    shm_size: 512m
    mem_limit: ${PDFWISE_MEMORY:-2g}
    security_opt:
      - no-new-privileges:true
    logging:
      driver: json-file
      options: { max-size: 10m, max-file: '3' }

  caddy:
    image: caddy:2.8-alpine
    restart: unless-stopped
    depends_on:
      pdfwise:
        condition: service_healthy
    ports:
      - '80:80'
      - '443:443'
      - '443:443/udp'
    environment:
      DOMAIN: ${DOMAIN}
      MAX_UPLOAD_MB: ${MAX_UPLOAD_MB:-100}
      TRUSTED_PROXIES: ${TRUSTED_PROXIES:-private_ranges}
    volumes:
      - ./deploy/Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    logging:
      driver: json-file
      options: { max-size: 10m, max-file: '3' }

volumes:
  caddy_data:
  caddy_config:
